name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Next.js build needs these to be set; real values are not used at build time.
          # AWS credentials (keys or AWS_ROLE_ARN) are intentionally omitted — they are
          # only required at runtime, resolved via `src/lib/ai/aws-credentials.ts`.
          DATABASE_URL: postgresql://adventure:adventure@localhost:5432/adventure
          BETTER_AUTH_SECRET: build-time-placeholder-secret-at-least-32-chars
          BETTER_AUTH_URL: http://localhost:3001
          AWS_REGION: us-east-1
          BEDROCK_NARRATIVE_MODEL_ID: us.anthropic.claude-sonnet-4-20250514-v1:0
          BEDROCK_IMAGE_MODEL_ID: amazon.nova-canvas-v1:0
          STRIPE_SECRET_KEY: sk_test_build_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_build_placeholder
